server:
  port: 8080

spring:
  application:
    name: messenger
  datasource:
    url: jdbc:h2:mem:messenger;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwt:
    secret: ${JWT_SECRET:messenger-local-development-secret-key-2026}
    expiration: ${JWT_EXPIRATION:PT1H}